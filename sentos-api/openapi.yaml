    /orders/change-status:
        put:
            tags:
                - Siparişler
            summary: Sipariş durumu ve kargo bilgisi toplu güncelle
            description: |
                E-ticaret sitesi ve B2C siparişlerinin durumunu ve kargo bilgisini toplu olarak günceller. Pazaryeri siparişlerinde çalışmaz.

                * Tek istekte en fazla **25** sipariş gönderilebilir.
                * `status` alanına `5` (Kargoya Verildi) ve `6` (İptal Edildi) gönderilemez. Kargoya verme için `PUT /orders/{id}` ya da `POST /orders/update-tracking/{id}` kullanılır.
                * Kargo bilgisi `cargo_provider` ve `cargo_barcode` birlikte gönderilerek güncellenir. Kargo bilgisi `5`, `6` ve `99` durumlarıyla aynı istekte değiştirilemez.
                * Her sipariş ayrı işlenir; birinin hatalı olması diğerlerini engellemez. Sonuç `data` dizisinde sipariş bazında döner.

                ### Sipariş durumları
                * 1: Onay Bekliyor
                * 2: Onaylandı
                * 3: Tedarik Sürecinde
                * 4: Hazırlanıyor
                * 99: Teslim Edildi
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: array
                            maxItems: 25
                            items:
                                type: object
                                required:
                                    - order_id
                                properties:
                                    order_id:
                                        type: integer
                                        example: 1001
                                        description: Sentos sipariş ID'si (`GET /orders` yanıtındaki `id`).
                                    status:
                                        type: integer
                                        example: 4
                                        description: Yeni sipariş durumu. Gönderilmezse durum değişmez. `5` ve `6` gönderilemez.
                                    cargo_provider:
                                        type: string
                                        maxLength: 255
                                        example: Yurtiçi Kargo
                                        description: Kargo firması. `cargo_barcode` ile birlikte gönderilmelidir.
                                    cargo_barcode:
                                        type: string
                                        maxLength: 255
                                        example: '7260123456789'
                                        description: Kargo barkodu / takip numarası. `cargo_provider` ile birlikte gönderilmelidir.
                        examples:
                            status:
                                summary: Durum güncelleme
                                value:
                                    - order_id: 1001
                                      status: 4
                                    - order_id: 1002
                                      status: 3
                            cargo:
                                summary: Durum ve kargo bilgisi
                                value:
                                    - order_id: 1001
                                      status: 4
                                      cargo_provider: Yurtiçi Kargo
                                      cargo_barcode: '7260123456789'
            responses:
                '200':
                    description: Sipariş bazında sonuçlar
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                order_id:
                                                    type: integer
                                                    example: 1001
                                                status:
                                                    type: integer
                                                    example: 4
                                                    description: İşlemden sonraki sipariş durumu.
                                                is_success:
                                                    type: boolean
                                                    example: true
                                                cargo_provider:
                                                    type: string
                                                    example: Yurtiçi Kargo
                                                cargo_barcode:
                                                    type: string
                                                    example: '7260123456789'
                                                errors:
                                                    type: array
                                                    items:
                                                        type: string
                                                    example: []
                            example:
                                data:
                                    - order_id: 1001
                                      status: 4
                                      is_success: true
                                      cargo_provider: Yurtiçi Kargo
                                      cargo_barcode: '7260123456789'
                                      errors: []
                                    - order_id: 1002
                                      status: 1
                                      is_success: false
                                      cargo_provider: ''
                                      cargo_barcode: ''
                                      errors:
                                          - This endpoint supports e-commerce orders.
                '400':
