                description: Örnek request body
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/stocksPutBody'
                        examples:
                            sku:
                                summary: SKU ile
                                value:
                                    - sku: 1357912-R7
                                      stocks:
                                          warehouse: 1
                                          stock: 150
                            barcode:
                                summary: Barkod ile
                                value:
                                    - barcode: "8690000000001"
                                      stocks:
                                          warehouse: 1
                                          stock: 150
                            multi_warehouse:
                                summary: Birden fazla depo
                                value:
                                    - sku: 1357912-R7
                                      stocks:
                                          - warehouse: 1
                                            stock: 150
                                          - warehouse: 2
                                            stock: 20
                            multi_sku_multi_warehouse:
                                summary: 5 farklı SKU, 3 depo
                                description: Her kayıtta stocks dizisi ile aynı anda 3 depoya stok gönderilir. Tek istekte en fazla 100 kayıt gönderilebilir.
                                value:
                                    - sku: 1357912-R7
                                      stocks:
                                          - warehouse: 1
                                            stock: 150
                                          - warehouse: 2
                                            stock: 20
                                          - warehouse: 3
                                            stock: 0
                                    - sku: 1357912-R8
                                      stocks:
                                          - warehouse: 1
                                            stock: 75
                                          - warehouse: 2
                                            stock: 10
                                          - warehouse: 3
                                            stock: 5
                                    - sku: TU-075-M545-R5
                                      stocks:
                                          - warehouse: 1
                                            stock: 40
                                          - warehouse: 2
                                            stock: 0
                                          - warehouse: 3
                                            stock: 12
                                    - sku: TU-076
                                      stocks:
                                          - warehouse: 1
                                            stock: 18
                                          - warehouse: 2
                                            stock: 6
                                          - warehouse: 3
                                            stock: 3
                                    - sku: AB-2024-M12
                                      stocks:
                                          - warehouse: 1
                                            stock: 0
                                          - warehouse: 2
                                            stock: 30
                                          - warehouse: 3
                                            stock: 8
            responses:
                '200':
                    description: Success Response
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    total:
                                        type: integer
                                        description: İstekteki kayıt sayısı
                                        example: 2
                                    updated:
                                        type: integer
                                        description: Başarıyla işlenen kayıt sayısı
                                        example: 1
                                    errors:
                                        type: array
                                        description: İşlenemeyen kayıtlar
                                        items:
                                            type: object
                                            properties:
                                                index:
                                                    type: integer
                                                    description: Kaydın istekteki sırası (0'dan başlar)
                                                    example: 1
                                                sku:
                                                    type: string
                                                    example: ""
                                                barcode:
                                                    type: string
                                                    example: "8690000000001"
                                                message:
                                                    type: string
                                                    example: 8690000000001 barcode is not found.
                '422':
                    description: Geçersiz istek
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Maximum 100 items can be sent in one request.
                '429':
                    description: Önceki istek henüz tamamlanmadı
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: A previous request is still being processed. Please wait for it to complete before sending a new request.
            security:
                - basicAuth: []
