            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: 1001
                  description: Sentos sipariş ID'si
            responses:
                '200':
                    description: Teslim edildi olarak işaretlendi
                    content:
                        application/json:
                            example:
                                message: Successfully
                '402':
                    description: Platform ya da sipariş durumu desteklenmiyor veya platform işlemi reddetti
                    content:
                        application/json:
                            example:
                                message: This orders platform or status not supported this method.
                '404':
                    description: Sipariş bulunamadı
            security:
                - basicAuth: []
    /carriers:
        get:
            tags:
                - Kargo Firmaları
            summary: Kargo firmalarını listele
            description: |
                Platformlara göre kullanılabilen kargo firmalarını ve kodlarını listeler. Bu kodlar `POST /orders/change-carrier/{id}` ve `POST /orders/alternative-delivery/{id}` servislerinde kullanılır.

                Yanıtta yer alan platformlar: `trendyol`, `hepsiburada`, `idefix`, `ideasoft`, `pazarama`, `lcw`, `koctas`, `ticimax`.

                * Trendyol, Hepsiburada, Pazarama, LCW ve Koçtaş için kodlar Sentos kargo kodlarıdır (ör. `aras`, `yurtici`); yalnız o platformda desteklenen firmalar listelenir.
                * Idefix, Ideasoft ve Ticimax için kodlar platformun kendi kargo kimlikleridir.
            responses:
                '200':
                    description: Platform bazında kargo firmaları
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            name:
                                                type: string
                                                example: Yurtiçi Kargo
                                                description: Kargo firması adı
                                            code:
                                                type: string
                                                example: yurtici
                                                description: İsteklerde kullanılacak kod
                            example:
                                trendyol:
                                    - name: Aras Kargo
                                      code: aras
                                    - name: Yurtiçi Kargo
                                      code: yurtici
                                hepsiburada:
                                    - name: Hepsijet
                                      code: hepsijet
                                    - name: Yurtiçi Kargo
                                      code: yurtici
                                idefix:
                                    - name: Aras Kargo
                                      code: '1'
                                ticimax:
                                    - name: Yurtiçi Kargo
                                      code: '3'
                '422':
                    description: Kargo firmaları bulunamadı
                    content:
                        application/json:
                            example:
                                message: Carriers not found, contact software support
            security:
                - basicAuth: []

