openapi: 3.0.0
info:
    title: Sentos API
    description: |
        ### Sentos API Docs

        API metodlarına erişmek için URL olarak **https://firma-adi.sentos.com.tr/api** adresi kullanılmalıdır.
        İstekleri gönderirken header içerisinde Content-Type:"application/json" olmalıdır.

        API vasıtasıyla;

        * Kategori işlemleri
        * Sipariş işlemleri
        * Ürün işlemleri
        * Depo işlemleri
        * ERP işlemleri
        * Platform işlemleri
        * Perakende işlemleri yapabilirsiniz.
        * İade Talep Listesine erişebilirsiniz.

        ### Authenticating

        Sentos API kimlik doğrulama için Basic Auth kullanmaktadır. Bu protokolü destekleyen istemci kütüphanelerini kullanarak oturum açabilir ve API'yi kullanabilirsiniz.
        API bilgilerine Sentos paneli üzerinden Hesabım sayfasından ulaşılabilir. Postman Collection'ı :
        <a href="#" id="postmandownload" download="Sentos_Postman.json">İndir</a>


        ### Rate Limit

        * Aynı body ile GET 2/dk
        * POST 12/dk



