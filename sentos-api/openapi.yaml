        put:
            tags:
                - Siparişler
            summary: Api üzerinden oluşturulan siparişlerin durumunu günceller
            description: |
                ### Api üzerinden oluşturulan siparişlerin durumları günceller. Bu endpoint üzerinden;

                #### Sipariş Durumumlarını aşağıdaki durumlar ile değiştirebilirsiniz

                * 1: Onay Bekliyor
                * 2: Onaylandı
                * 3: Tedarik Sürecinde
                * 4: Hazırlanıyor
                * 5: Kargoya Verildi
                * 6: İptal Edildi
                * 99: Teslim Edildi

                #### Sipari durumunu  5- Kargoya Verildi statüsüne çekmek istendiğinde aşağıdaki alanlar zorunludur

                * cargo_company: Kargo firması
                * tracking_number: Takip numarası
                * tracking_url: Takip url

                #### Sipari durumunu 6 - İptal Edildi statüsüne çekmek istendiğinde aşağıdaki alanlar zorunludur

                * add_stock: İptal edilen ürünlerin stok deposuna eklenme durumu
                * cancel_reason: İptal nedeni
                * cancel_date: İptal tarihi format: Y-m-d H:i:s

                #### Sipari durumunu 99 - Teslim Edildi statüsüne çekmek istendiğinde aşağıdaki alanlar zorunludur

                * delivery_date: Teslim tarihi format: Y-m-d H:i:s
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: null
            requestBody:
                description: Örnek request body
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - status
                            properties:
                                status:
                                    type: integer
                                    description: Sipariş durumu. Geçerli değerler 1- Onay Bekliyor, 2- Onaylandı, 3- Tedarik Sürecinde, 4- Hazırlanıyor, 5- Kargoya Verildi, 6- İptal Edildi, 99- Teslim Edildi
                                    enum:
                                        - 1
                                        - 2
                                        - 3
                                        - 4
                                        - 5
                                        - 6
                                        - 99
                                    example: 5
                                data:
                                    type: object
                                    description: Duruma bağlı ek bilgileri içerir. Bazı alanlar yalnızca belirli durumlar için gereklidir.
                                    properties:
                                        cargo_company:
                                            type: string
                                            description: Kargo firması adı. **Status = 5** olduğunda zorunludur.
                                            maxLength: 255
                                        tracking_number:
                                            type: string
                                            description: Kargo takip numarası. **Status = 5** olduğunda zorunludur.
                                            maxLength: 255
                                        tracking_url:
                                            type: string
                                            description: Kargo takip bağlantısı. **Status = 5** olduğunda zorunludur.
                                            format: uri
                                            maxLength: 255
                                        add_stock:
                                            type: boolean
                                            description: İade edilen ürünlerin stoğa eklenip eklenmeyeceğini belirtir. **Status = 6** olduğunda zorunludur.
                                        cancel_reason:
                                            type: string
                                            description: İptal nedeni. **Status = 6** olduğunda zorunludur.
                                            maxLength: 255
                                        cancel_date:
                                            type: string
                                            format: date-time
                                            description: İptal tarihi. Format Y-m-d H:i:s. **Status = 6** olduğunda zorunludur.
                        examples:
                            prop1:
                                summary: Kargoya Verildi
                                value:
                                    cargo_company: Kargo Firması
                                    tracking_number: TR1234567
                                    tracking_url: https://kargo-firmasi.com/takip/TRK123456789
                            prop2:
                                summary: Sipariş İptal
                                value:
                                    add_stock: true
                                    cancel_reason: Müşteri beğenmedi
                                    cancel_date: '2025-01-01 12:00:00'
                            prop3:
                                summary: Teslim Edildi
                                value:
                                    delivery_date: '2025-01-20 12:00:00'
            responses:
                '200':
                    description: Başarılı
                    content:
                        appliction/json:
                            schema:
                                type: object
                                properties:
                                    errors:
                                        type: array
                                        items:
                                            type: string
                                        example: []
                '422':
                    description: Unprocessable Entity
                    content:
                        appliction/json:
                            schema:
                                type: object
                                properties:
                                    errors:
                                        type: array
                                        items:
                                            type: string
                                        example:
                                            - This endpoint only supports source B2C
