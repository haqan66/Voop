    /orders/change-carrier/{id}:
        post:
            tags:
                - Siparişler
            summary: Sipariş kargo firmasını değiştir
            description: |
                Pazaryeri siparişinin kargo firmasını platform üzerinde değiştirir.

                **Desteklenen platformlar:** Trendyol, Hepsiburada, Idefix

                * Trendyol ve Hepsiburada için `code`, `GET /carriers` yanıtındaki `trendyol` / `hepsiburada` listesinden alınır (ör. `yurtici`, `aras`).
                * Idefix için `code`, `GET /carriers` yanıtındaki `idefix` listesinden alınır.
                * Sipariş zaten aynı kargo firmasındaysa istek reddedilir.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: 1001
                  description: Sentos sipariş ID'si
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - code
                            properties:
                                code:
                                    type: string
                                    example: yurtici
                                    description: Yeni kargo firmasının kodu (`GET /carriers`).
            responses:
                '200':
                    description: Kargo firması değiştirildi
                    content:
                        application/json:
                            example:
                                message: Successfully
                '400':
                    description: Geçersiz kod ya da desteklenmeyen platform
                    content:
                        application/json:
                            examples:
                                unsupported_platform:
                                    summary: Platform desteklenmiyor
                                    value:
                                        message: 'This orders platform is not supported. This method supported platforms: trendyol,hepsiburada,idefix'
                                same_code:
                                    summary: Aynı kargo firması
                                    value:
                                        message: This order carrier has same code.
                '402':
                    description: Platform işlemi reddetti; mesaj platformdan gelir
                '404':
                    description: Sipariş bulunamadı
            security:
                - basicAuth: []
    /orders/alternative-delivery/{id}:
        post:
            tags:
                - Siparişler
            summary: Alternatif teslimat ile kargoya ver
            description: |
                Siparişi, platformun anlaşmalı kargosu yerine kendi gönderiminizle (alternatif teslimat / mağaza hesabı) kargoya verir.

                **Desteklenen platformlar:** Trendyol, Ticimax, Hepsiburada

                Sipariş durumu `1`, `2`, `3` ya da `4` olmalıdır. `tracking_number` ya da `url` alanlarından en az biri zorunludur.

                #### Platforma göre kurallar
                * **Trendyol:** `tracking_number` ya da `url` gönderilir; `deci` ve `quantity` isteğe bağlıdır. Başarılı yanıtta Trendyol'un verdiği takip numarası döner.
                * **Ticimax:** `tracking_number` ve `cargo_code` zorunludur. `cargo_code`, `GET /carriers` yanıtındaki `ticimax` listesinden alınır. Başarılı olursa sipariş durumu `5` (Kargoya Verildi) olur.
                * **Hepsiburada:** Mağazada Hepsiburada mağaza hesabı (kendi kargonla gönderim) aktif olmalıdır. `cargo_code`, `GET /carriers` yanıtındaki `hepsiburada` listesinden alınır; gönderilmezse `ET` kullanılır. Başarılı olursa sipariş durumu `5` olur.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: 1001
                  description: Sentos sipariş ID'si
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tracking_number:
                                    type: string
                                    maxLength: 255
                                    example: TR1234567
                                    description: Kargo takip numarası. `url` yoksa zorunludur.
                                url:
                                    type: string
                                    format: uri
                                    example: https://kargo-firmasi.com/takip/TR1234567
                                    description: Kargo takip bağlantısı. `tracking_number` yoksa zorunludur.
                                deci:
                                    type: number
                                    example: 2
                                    description: Desi (Trendyol). 0'dan büyük olmalıdır.
                                quantity:
                                    type: integer
                                    example: 1
                                    description: Koli adedi (Trendyol). 0'dan büyük olmalıdır.
                                cargo_code:
                                    type: string
                                    maxLength: 255
                                    example: yurtici
                                    description: Kargo firması kodu (Ticimax'ta zorunlu, Hepsiburada'da isteğe bağlı).
                                description:
                                    type: string
                                    maxLength: 255
                                    example: Kendi aracımızla teslim
                                    description: Açıklama
                        examples:
                            trendyol:
                                summary: Trendyol
                                value:
                                    tracking_number: TR1234567
                                    deci: 2
                                    quantity: 1
                            ticimax:
                                summary: Ticimax
                                value:
                                    tracking_number: TR1234567
                                    url: https://kargo-firmasi.com/takip/TR1234567
                                    cargo_code: '3'
                            hepsiburada:
                                summary: Hepsiburada
                                value:
                                    tracking_number: TR1234567
                                    url: https://kargo-firmasi.com/takip/TR1234567
                                    cargo_code: yurtici
            responses:
                '200':
                    description: Kargoya verildi
                    content:
                        application/json:
                            examples:
                                trendyol:
                                    summary: Trendyol
                                    value:
                                        message: Successfully
                                        tracking_number: '7330012345678'
                                others:
                                    summary: Ticimax / Hepsiburada
                                    value:
                                        message: Successfully
                '400':
                    description: Gövde doğrulamadan geçmedi
                    content:
                        application/json:
                            example:
                                message: The tracking number field is required when url is not present.
                '402':
                    description: Platform ya da sipariş durumu desteklenmiyor veya platform işlemi reddetti
                    content:
                        application/json:
                            examples:
                                unsupported:
                                    summary: Platform desteklenmiyor
                                    value:
                                        message: This orders platform not supported this method.
                                hb_store_account:
                                    summary: Hepsiburada mağaza hesabı kapalı
                                    value:
                                        message: Hepsiburada magaza hesabı must be active.
                '404':
                    description: Sipariş bulunamadı
            security:
                - basicAuth: []
    /orders/alternative-delivered/{id}:
        post:
            tags:
                - Siparişler
            summary: Alternatif teslimatı teslim edildi yap
            description: |
                Alternatif teslimat ile kargoya verilmiş siparişi platformda **teslim edildi** olarak işaretler ve Sentos'ta sipariş durumunu `99` (Teslim Edildi) yapar.

