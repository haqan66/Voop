    /products/{id}/upload-image:
        post:
            tags:
                - Ürünler
            summary: Resim yükleme
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: 171
            description: |
            requestBody:
                description: |
                    - Görsel Yükleme ve Atama Kuralları
                      - Varyantlı ürünlerde istekler varyant SKU bilgisi ile gönderilmelidir. Basit ürünlerde ise ürün SKU kullanılması zorunludur.
                      - Görsel verisi base64 veya url parametresi ile iletilebilir. Aynı istekte yalnızca tek bir yöntem kullanılmalıdır.
                      - Uzantı olarak png, jpg, jpeg, webp formatları desteklenmektedir.

                    - Base64 Kullanımı
                      - base64 yöntemi ile gönderilen her istek, tek bir görsel içermelidir.
                      - Her base64 veri, ayrı bir element olarak işlenir.

                    - URL Kullanımı
                      - url parametresi string array tipindedir.
                      - Tek bir istekte en fazla 10 adet URL gönderilebilir.

                    - Görsel İsimlendirme
                      - name parametresi gönderildiğinde, birden fazla URL ile görsel yüklenmesi durumunda, görsel isimlerinin benzersiz olması için dosya adına otomatik olarak sıralı bir anahtar eklenir.

                    - Görsel Atama Parametreleri
                      - setimage_color = true gönderilmesi halinde, işlenen görseller tüm renk varyantlarına atanır.
                      - setimage_model = true gönderilmesi halinde, işlenen görseller tüm modellere atanır.

                    - Görsel Silme İşlemleri
                        - delete_images = true gönderilmesi halinde, ilgili varyanta ait tüm görseller silinir.
                        - delete_images parametresi;
                    setimage_color ve/veya setimage_model parametreleri ile birlikte gönderilirse,
                    belirtilen koşulları sağlayan tüm görseller silinir.

                content:
                    application\json:
                        schema:
                            type: array
                            items:
                                properties:
                                    sku:
                                        type: string
                                        example: TU10224742_36
                                        required: true
                                    base64:
                                        type: string
                                        example: data:image/jpeg;base64,/9j/4AAQSkZJRgABAgEASABI...
                                        required: false
                                    url:
                                        type: object
                                        example: ["https://wallpapercave.com/wp/wp90402131625.jpg","https://cdn.wallpapersafari.com/43/97/MPjl3523076.jpg"]
                                        required: false
                                    name:
                                        type: string
                                        example: mavi çocuk ayakkabı
                                        required: false
                                    order:
                                        type: integer
                                        example: 1
                                        required: false
                                    setimage_color:
                                        type: bool
                                        example: true
                                        required: false
                                    setimage_model:
                                        type: bool
                                        example: true
                                        required: false
                                    delete_images:
                                        type: bool
                                        example: true
                                        required: false
            responses:
                '200':
                    description: Success Response
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        sku:
                                            type: string
                                        source:
                                            type: string
                                            format: uri
                                        url:
                                            type: string
                                        error:
                                            type: string
                            examples:
                                multiple_items:
                                    summary: Birden fazla görsel çıktısı
                                    value:
                                        - sku: "TU10224742_36"
                                          source: "https://wallpapercave.com/wp/wp90402131625.jpg"
                                          url: "https://cdn.site.com/images/123.jpg"
                                          error: ""
                                        - sku: "TU10224742_36"
                                          source: "https://cdn.wallpapersafari.com/43/97/MPjl3523076.jpg"
                                          url: ""
                                          error: "The image must be a valid image file of type; png, jpg, jpeg, webp"
                '400':
                    description: Geçersiz ID
                '404':
                    description: Ürün bulunamadı
            security:
                - basicAuth: []

    /products/stocks:
        put:
            tags:
                - Ürünler
            summary: SKU veya barkod ile toplu stok güncelle
            description: |
                ### /products/stocks

                  Örnek: ./api/products/stocks

                  Bu istek ile tek seferde **en fazla 100** ürün/varyantın stoğu güncellenir.

                  * Her kayıtta `sku` veya `barcode` alanlarından biri zorunludur. İkisi birlikte gönderilirse `sku` kullanılır.
                  * `sku` önce varyant stok kodlarında, bulunamazsa ürün stok kodlarında aranır. Varyantlı ürünlerde varyant stok kodu gönderilmelidir.
                  * `stocks` tek obje olarak gönderilebileceği gibi, birden fazla depo için obje dizisi olarak da gönderilebilir.
                  * Bulunamayan kayıtlar diğer kayıtların güncellenmesini engellemez, `errors` alanında döner.
                  * Gövde doğrulamasından geçmeyen bir kayıt olursa istek tamamen reddedilir (422).

                  ### Eş zamanlı istek limiti

                  Bu servise aynı anda yalnızca **bir** istek gönderilebilir. Önceki istek yanıt dönmeden gönderilen yeni istek işlenmez ve **429** hatası döner.
                  Yeni isteği, bir önceki isteğin yanıtını aldıktan sonra gönderiniz.
