    /claims:
        get:
            description: |
                ### Claim status:
                  * 1 - Talep Oluşturulan
                  * 2 - Aksiyon Bekleyen
                  * 3 - Onaylanan
                  * 4 - Reddedilen
                  * 5 - İptal Edilen
                  * 6 - İhtilaf
                  * 7 - Servis/Analiz

                ### Claim types:
                  * 1 - İade
                  * 2 - Değişim
                  * 3 - Fatura Eksik
                  * 4 - Garanti Belgesi Eksik
                  * 5 - Parça/Ürün Eksik
                  * 6 - Teslim Edilemeyen Gönderi
                  * 7 - Hasarlı/Kusurlu Ürün Gönderildi
                  * 8 - Yanlış Ürün Gönderildi
                  * 9 - Fazla Ürün Gönderildi
                  * 10 - İptal

                ### Platforms:
                  * TY - Trendyol
                  * HB - Hepsiburada
                  * N11 - N11
                  * CS - Çiçeksepeti
                  * PZRM - Pazarama
                  * BYMN - Beymen
                  * IDFX - İdefix
                  * BYNR - Boyner
                  * LCW - Lcw
                  * İDEA - ideasoft
                  * TSFT - T-soft
                  * HIPO - Hipotenüs
                  * IKAS - İkas
                  * SPFY - Shopify
                  * TICI - Ticimax

                ### Orderby fields:
                * id
                * created_date
                * claim_date
                * refund_date

                ### Direction options:
                * ASC
                * DESC
            tags:
                - İade Talepleri
            summary: İade Taleplerini listele
            parameters:
                - in: query
                  name: size
                  required: false
                  schema:
                      type: integer
                      example: 25
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                      example: 1
                - in: query
                  name: created_start_date
                  required: false
                  schema:
                      type: datetime or date
                      example: 2026-01-02 15:00
                - in: query
                  name: created_end_date
                  required: false
                  schema:
                      type: datetime or date
                      example: 2026-01-07 15:00
                - in: query
                  name: claim_start_date
                  required: false
                  schema:
                      type: datetime or date
                      example: 2026-01-02 15:00
                - in: query
                  name: claim_end_date
                  required: false
                  schema:
                      type: datetime or date
                      example: 2026-01-07 15:00
                - in: query
                  name: refund_start_date
                  required: false
                  schema:
                      type: datetime or date
                      example: 2026-01-02 15:00
                - in: query
                  name: refund_end_date
                  required: false
                  schema:
                      type: datetime or date
                      example: 2026-01-07 15:00
                - in: query
                  name: order_id
                  required: false
                  schema:
                      type: integer
                      example: 19250
                - in: query
                  name: order_numner
                  required: false
                  schema:
                      type: string
                      example: "#1770"
                - in: query
                  name: orderby
                  schema:
                      type: string
                      example: id
                - in: query
                  name: orderby_direction
                  required: false
                  schema:
                      type: string
                      example: DESC
                - in: query
                  name: platform
                  required: false
                  schema:
                      type: string
                      example: TY
                - in: query
                  name: shop_id
                  required: false
                  schema:
                      type: integer
                      example: 1
            requestBody:
                content:
                    application/json:
                        schema:
                            example:
                                status: [1,2]
                                types: [3]

            responses:
                '200':
                    description: Success Response
                    content:
                        application/json:
                            schema:
                                example:
                                    - {
                                        "page": 2,
                                        "size": 25,
                                        "total_elements": 51,
                                        "total_pages": 3,
                                        "data": [
