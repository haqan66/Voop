paths:

    /categories:
        description: categories
        get:
            summary: Kategorileri çek
            tags:
                - Kategoriler
            description: |
                __Kategorileri Cek__
            responses:
                '200':
                    description: Success Response
                    content:
                        application/json:
                            schema:
                                example:
                                    - id: 1
                                      name: telefon
                                      parent_id: 4
                                      sub_categories: []
                                    - id: 2
                                      name: laptop
                                      parent_id: 4
                                      sub_categories:
                                          - id: 286
                                            parent_id: 285
                                            name: Example Category 2
                                            sub_categories:
                                                - id: 287
                                                  parent_id: 286
                                                  name: Example Category 3
                                                  sub_categories: []
                '404':
                    description: Kayıt bulunamadı
            security:
                - basicAuth: []
        post:
            tags:
                - Kategoriler
            summary: Kategori ekle
            requestBody:
                description: Örnek request body
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/categoryPost'
            responses:
                '201':
                    description: Kayıt başarıyla eklendi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                        example: 3
                                    name:
                                        type: string
                                        example: kulaklıklar
                                    parent_id:
                                        type: integer
                                        example: 0
                '405':
                    description: Geçersiz giriş
            security:
                - basicAuth: []
    /categories/{id}:
        description: ID ile kategori al
        get:
            tags:
                - Kategoriler
            summary: ID ile kategori çek
            description: ID vererek bir kategori alma
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: null
            responses:
                '200':
                    description: Success Response
                    content:
                        application/json:
                            schema:
                                example:
                                    id: 1
                                    name: telefon
                                    parent_id: 0
                                    sub_categories: []
                '400':
                    description: Geçersiz ID
                '404':
                    description: Kategori bulunamadı
            security:
                - basicAuth: []
        put:
            tags:
                - Kategoriler
            summary: Kategori güncelle
            description: |
                ### /categories/{id}
                  Güncellenecek kategorinin ID si url içinde bulunmalı
                  Örnek: ./categories/3
            operationId: updateUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
                      example: null
            requestBody:
                description: Sample Put request body
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/categoryPutBody'
            responses:
                '200':
                    description: Kategori güncellendi
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                        example: 3
                                    name:
                                        type: string
                                        example: bluetooth kulaklık
                                    parent_id:
                                        type: integer
                                        example: 0
                '400':
                    description: Geçersiz ID
            security:
                - basicAuth: []
